<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | LUMOLA</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/font.css">
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/auth.css">
  <script src="./js/auth.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-panel">
    <a class="auth-logo" href="./index.html"><img src="./img/logo.svg" alt="LUMOLA 메인페이지로 이동" width="285" height="100"></a>
    <h1>회원가입</h1>
    <p class="auth-intro">LUMOLA 멤버스와 함께하는 일상</p>
    <form id="signup-form" novalidate>
      <div class="auth-field"><label for="name">이름</label><input id="name" name="name" autocomplete="name" placeholder="이름을 입력해주세요" required aria-describedby="auth-message"></div>
      <div class="auth-field"><label for="identity">아이디 또는 이메일</label><input id="identity" name="identity" autocomplete="username" placeholder="아이디 또는 이메일을 입력해주세요" required aria-describedby="auth-message"></div>
      <div class="auth-field"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="비밀번호를 입력해주세요" required aria-describedby="auth-message"></div>
      <div class="auth-field"><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="비밀번호를 다시 입력해주세요" required aria-describedby="auth-message"></div>
      <div class="auth-agreements">
        <label class="auth-check"><input name="terms" type="checkbox" required>이용약관 동의 (필수)</label>
        <details><summary>이용약관 보기</summary><p>이 사이트는 LUMOLA 쇼핑몰 포트폴리오입니다. 가입과 주문은 체험 기능이며 실제 회원 계정이나 거래가 생성되지 않습니다.</p></details>
        <label class="auth-check"><input name="privacy" type="checkbox" required>개인정보 처리방침 동의 (필수)</label>
        <details><summary>개인정보 처리방침 보기</summary><p>입력한 이름, 아이디 및 비밀번호는 서버로 전송되거나 저장되지 않습니다. 로그인 체험 시 로그인 상태만 선택한 유지 기간 동안 현재 브라우저에 저장합니다.</p></details>
      </div>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
      <button class="auth-submit" type="submit">회원가입</button>
    </form>
    <p class="auth-existing">이미 계정이 있으신가요? <a href="./login.html">로그인</a></p>
    <p class="auth-note">포트폴리오용 회원가입 체험입니다. 실제 회원 계정은 생성되지 않습니다.</p>
    <a class="auth-home" href="./index.html">쇼핑몰로 돌아가기</a>
  </main>
</body>
</html>
